name: APK Hora y Clima

on:
  push:
    paths:
      - 'hora-clima-app/**'
      - '.github/workflows/hora-clima-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hora-clima-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk HoraClima.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HoraClima-apk
          path: hora-clima-app/HoraClima.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hora-clima-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Hora y Clima (versión ${{ github.run_number }})
          body: |
            Descarga **HoraClima.apk** desde el teléfono y ábrelo para instalarlo.
            Se instala encima de la versión anterior sin perder nada.
          files: hora-clima-app/HoraClima.apk
          make_latest: true
